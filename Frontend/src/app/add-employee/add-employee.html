<div class="col-md-8 offset-md-3">
<h3>Add New Employee</h3>

   <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>First Name</label>
      <input type="text" class="form-control" placeholder="Enter First Name" id="firstName"
       name="firstName" [(ngModel)]="employee.firstName">
    </div>

    <div class="form-group">
      <label>Last Name</label>
      <input type="text" class="form-control" placeholder="Enter Last Name" id="lastName"
       name="lastName" [(ngModel)]="employee.lastName">
    </div>

    <div class="form-group">
      <label>Salary</label>
      <input type="number" class="form-control" placeholder="Enter Salary" id="salary"
       name="salary" [(ngModel)]="employee.salary">
    </div>

    <button type="submit" class="btn btn-success">Submit</button>
  </form>
</div>
